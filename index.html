<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaka's Amazing Tuner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>

    <div class="header">
      <a href="https://github.com/AbakaMonkey/AbakasAwesomeTuner"><button class="github"></button></a>
      <a href="https://www.youtube.com/@abaka153"><button class="youtube"></button></a>
      <h2>Abaka's Awesome Tuner</h2>
    </div>

    <h3 id="modeDisplay">Tuner</h3>

    <div class="displays">
      <div class="a">
        <h3 id="aLabel">A</h3>
        <h2 id="aDisplay">Gb4</h2>
      </div>

      <div class="bb">
        <h3 id="bbLabel">Bb</h3>
        <h2 id="bbDisplay">B4</h2>
      </div>

      <h1 id="concertDisplay">A4</h1>

      <div class="eb">
        <h3 id="ebLabel">Eb</h3>
        <h2 id="ebDisplay">B4</h2>
      </div>

      <div class="f">
        <h3 id="fLabel">F</h3>
        <h2 id="fDisplay">G4</h2>
      </div>
    </div>

    <div class="controls">
      <button id="minus" onclick="decreaseFrequency()">-</button>
      <button id="playback" onclick="playbackControls()">></button>
      <button id="plus" onclick="increaseFrequency()">+</button>
    </div>
    
    <script src="./script.js"></script>
  </body>
</html>
