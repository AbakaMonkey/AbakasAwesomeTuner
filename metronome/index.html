<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaka's Amazing Tuner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>

    <div class="header">
      <a href="https://github.com/AbakaMonkey/AbakasAwesomeTuner"><button class="github"></button></a>
      <a href="https://www.youtube.com/@abaka153"><button class="youtube"></button></a>
      <h2>Abaka's Awesome Tuner</h2>
    </div>

    <h3 id="modeDisplay">Metronome - UNFINISHED</h3>
    <h1 id="bpmDisplay">120</h1>

    <div class="controls">
      <button id="minus" onclick="decreaseBpm()">-</button>
      <button id="playback" onclick="playbackControls()">></button>
      <button id="plus" onclick="increaseBpm()">+</button>
    </div>
    
    <script src="./script.js"></script>
  </body>
</html>
